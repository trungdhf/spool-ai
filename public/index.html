<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spool AI — 配管アイソメ図 → 工場製作スプール</title>
<style>
body{margin:0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f4f6f8;color:#1d2733}
header{background:#14324f;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}

<header><h1>Spool AI</h1><small>CAD出力のアイソメ図PDFを読み取り、工場で製作できるスプールに自動分割・スプール図を作成 / Isometric PDF → shop spools</small></header>
<main>
<div class="card">
 <div id="drop" class="drop">ここに CAD から出力した PDF をドロップ（複数シート可）<br><span class="muted">or click to choose files</span></div>
 <input id="file" type="file" accept="application/pdf" multiple hidden>
 <div class="row">
  <button id="run">解析する / Analyze</button>
  <button id="sample" class="sec">サンプル図面（4シート）で試す</button>
  <label><input id="ai" type="checkbox" checked> AIエージェントで検証（BOM配分・切断長）</label>
  <span id="status"></span>
 </div>
 <div id="files" class="muted"></div>
</div>
<div id="out"></div>
</main>
<script>
const $=s=>document.querySelector(s);let files=[];
const drop=$('#drop'),inp=$('#file');
drop.onclick=()=>inp.click();inp.onchange=()=>setFiles([...inp.files]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');setFiles([...e.dataTransfer.files].filter(f=>f.name.toLowerCase().endsWith('.pdf')))};
function setFiles(f){files=f;$('#files').textContent=f.map(x=>x.name).join(' / ')}
const b64=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)});
async function go(sample){
 if(!sample&&!files.length){alert('PDFを選択してください');return}
 $('#run').disabled=$('#sample').disabled=true;const t0=Date.now();
 $('#status').textContent=$('#ai').checked?'解析中… ベクトル抽出 → スプール分割 → AIエージェント検証（〜1分）':'解析中…';
 try{
  const body={ai:$('#ai').checked,files:sample?[]:await Promise.all(files.map(async f=>({name:f.name,data:await b64(f)})))};
  const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(j.error)throw new Error(j.error);render(j);
  $('#status').textContent=`完了 (${((Date.now()-t0)/1000).toFixed(1)}s)`;
 }catch(e){$('#status').innerHTML='<span class="ng">エラー: '+e.message+'</span>'}
 $('#run').disabled=$('#sample').disabled=false;
}
$('#run').onclick=()=>go(false);$('#sample').onclick=()=>go(true);
const dl=(b,n)=>{const a=document.createElement('a');a.href='data:application/pdf;base64,'+b;a.download=n;a.click()};
// --- PayPal (sandbox): fabrication-order deposit checkout ---
function quote(){const w=_j?_j.spools.reduce((a,s)=>a+s.welds.length,0):0,s=_j?_j.spools.length:0;
 return {total:(w*8+s*25).toFixed(2),desc:`Spool fabrication deposit: ${s} spools x $25 + ${w} welds x $8`,w,s}}
async function payNow(){const q=quote();
 try{const r=await fetch('/api/paypal',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({action:'create',amount:q.total,description:q.desc,return_url:location.origin+'/'})});
  const j=await r.json();if(j.error)throw new Error(j.error);location.href=j.approve_url;
 }catch(e){alert('PayPal: '+e.message)}}
(async()=>{const q=new URLSearchParams(location.search);const oid=q.get('token');
 if(q.get('cancelled')){$('#status').innerHTML='<span class="warn">PayPalでの支払いがキャンセルされました</span>';history.replaceState({},'',location.pathname);return}
 if(!oid)return;$('#status').textContent='PayPal 支払いを確定中…';
 try{const r=await fetch('/api/paypal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'capture',order_id:oid})});
  const j=await r.json();if(j.error)throw new Error(j.error);
  $('#status').innerHTML=`<span class="ok">PayPal 支払い完了: ${esc(j.amount)} — capture ${esc(j.capture_id)} (${esc(j.payer)}) 発注を受け付けました</span>`;
 }catch(e){$('#status').innerHTML='<span class="ng">PayPal capture error: '+e.message+'</span>'}
 history.replaceState({},'',location.pathname)})();
const dlt=(t,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click()};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function model3dCard(j){
 const m=j.model3d;if(!m||!m.spools||!m.spools.length)return '';
 const opts=['<option value="all">全体（組立）</option>']+m.spools.map((s,i)=>`<option value="${i}">${s.name}${s.status==='OK'?'':' ⚠要確認'}</option>`).join('');
 let h=`<div class="card"><h3 style="margin-top:0">3Dモデル（アイソメ → 3D座標）</h3>
 <div class="row"><select id="sel3d" style="padding:8px;border-radius:6px">${opts}</select>
 <button class="sec" onclick="dlt(JSON.stringify(_j.model3d,null,1),'model3d.json')">JSON</button>`+
 m.spools.map((s,i)=>`<button class="sec" onclick="dlt(_j.model3d_csv['${s.name}'],'${s.name}_3DModelEditor.csv')">${s.name} CSV</button>`).join('')+
 m.spools.map((s,i)=>`<button class="sec" onclick="dlt(_j.model3d_pcf['${s.name}'],'${s.name}.pcf')">${s.name} PCF</button>`).join('')+`</div>
 <div id="v3d"></div>
 <div class="axisnote">X=E, Y=N, Z=up ／ 各スプールの最初のノード=(0,0,0) ／ CSV=3DModelEditor形式, PCF=ISOGEN形式 ／ ⚠要確認=寸法なし推定・斜管</div>
 <div id="v3dtable"></div></div>`;
 return h;
}
function segsTable(sp){
 return `<table><tr><th>from</th><th>to</th><th>軸</th><th>長さmm</th><th>根拠</th><th></th></tr>`+
  sp.segments.map(s=>`<tr><td>${s.a}</td><td>${s.b}</td><td>${s.axis}</td><td>${s.length_mm}</td><td>${esc(s.source)}</td><td class="${s.confidence==='high'?'ok':'warn'}">${s.confidence}</td></tr>`).join('')+`</table>`;
}
function render(j){
 window._j=j;const rv=j.review||{};const chips=j.spools.map(s=>`<span class="chip" style="background:${s.color}">${s.name}</span>`).join(' ');
 let h=`<div class="card"><h2 style="margin-top:0">結果: ${j.spools.length} スプール ${chips}</h2>
 <div class="row"><button onclick="dl(_j.spools_pdf,'spool_drawings.pdf')">スプール図 PDF（全スプール）</button>
 <button class="sec" onclick="dl(_j.overview_pdf,'spool_overview.pdf')">色分け図面 PDF</button>
 <button class="sec" onclick="dlt(_j.cypher,'spool_graph.cypher')">Neo4j グラフ (Cypher)</button>
 <span class="muted">Neo4j: ${_j.neo4j&&_j.neo4j.pushed?'<span class=ok>保存済み ('+_j.neo4j.statements+' 文)</span>':'未接続 — Cypherをダウンロードしてインポート'}</span></div>
 ${(j.warnings||[]).map(w=>`<p class="warn"><b>警告:</b> ${esc(w)}</p>`).join('')}
 <div class="row" style="border-top:1px solid #e5e5e5;padding-top:10px;margin-top:6px"><b>発注見積:</b>
  <span id="quote">$${quote().total}（${quote().s} スプール × $25 + ${quote().w} 溶接 × $8）</span>
  <button onclick="payNow()" style="background:#ffc439;color:#111;font-weight:700">PayPal で発注・支払う（sandbox）</button>
  <span class="muted">スプール製作デポジット — PayPal Orders API</span></div>
 <p class="muted">AI: ${esc(rv.provider||'オフ（ルールのみ）')}${(rv.fallback_from||[]).length?' <span class=warn>（'+esc(rv.fallback_from.map(f=>f.split(':')[0]).join(', '))+' は利用不可のためフォールバック）</span>':''}</p>${rv.summary_ja?`<p>${esc(rv.summary_ja)}</p>`:''}`;
 if(rv.checks&&rv.checks.length){const ng=rv.checks.filter(c=>!c.ok).length;
  h+=`<details ${ng?'open':''}><summary>BOM照合（シートBOM＝スプール配分の合計）: <span class="${ng?'ng':'ok'}">${ng?ng+'件不一致':'全項目一致'}</span></summary><table><tr><th>SHT</th><th>PT</th><th>品名</th><th>BOM</th><th>配分合計</th><th></th></tr>`+
  rv.checks.map(c=>`<tr><td>${c.sheet}</td><td>${c.pt}</td><td>${esc(c.desc)}</td><td>${c.bom}</td><td>${c.allocated}</td><td class="${c.ok?'ok':'ng'}">${c.ok?'OK':'NG'}</td></tr>`).join('')+'</table></details>'}
 h+=`</div>`+model3dCard(j)+`<div class="card"><h3 style="margin-top:0">元図面（スプール別に色分け）</h3><div class="sheets">`+
  j.sheets.map(s=>`<div><b>SHT ${s.sheet_no}</b> <span class="muted">${esc(s.file)} · PIPE SPOOLS: ${s.spool_list.join(', ')} · 溶接 ${s.welds.length}</span><img src="data:image/png;base64,${s.png}"></div>`).join('')+`</div></div>`;
 h+=`<div class="card"><h3 style="margin-top:0">スプール図 / Spool drawings</h3><div class="spools">`+j.spools.map(s=>{const d=s.detail||{};
  const notes=[...(s.needs_review||[]),...(d.notes||[])];
  return `<div class="spool"><h3><span class="chip" style="background:${s.color}">${s.name}</span> SHT ${s.sheets.join(', ')}</h3>
  <img src="data:image/png;base64,${s.png}">
  <table><tr><th>工場溶接</th><td>${s.welds.length} 箇所（No. ${s.welds.join(', ')}）</td></tr>
  ${d.db!=null?`<tr><th>溶接DB</th><td>${d.db}（${j.weld_b}B × ${s.welds.length}）</td></tr>`:''}
  <tr><th>エルボ</th><td>${s.bends}</td></tr>${d.pipe_length_mm?`<tr><th>管切断長</th><td>${d.pipe_length_mm} mm</td></tr>`:''}
  <tr><th>シート間接続</th><td>${s.conts.map(c=>`SHT${c.sheet} CONT.${c.kind} SHT${c.to??'?'}`).join('<br>')||'-'}</td></tr>
  ${(d.bom||[]).length?`<tr><th>材料</th><td>${d.bom.map(b=>`SHT${b.sheet} PT${b.pt} ${esc(b.desc)} ×${esc(b.qty)}`).join('<br>')}</td></tr>`:''}
  ${notes.length?`<tr><th class="warn">要確認</th><td class="warn">${notes.map(esc).join('<br>')}</td></tr>`:''}</table></div>`}).join('')+`</div></div>`;
 $('#out').innerHTML=h;
 if(j.model3d&&j.model3d.spools&&j.model3d.spools.length)setup3d(j);
}
</script>

 const pb=document.createElement('button');pb.textContent='Ortho';pb.onclick=()=>toggleCam(pb);pb.style.cssText='padding:2px 8px;font-size:12px;cursor:pointer';tb.appendChild(pb);
 el.appendChild(tb);

};
const V=p=>new THREE.Vector3(p[0],p[2],-p[1]); // (X,Y,Z)->three(x,y,z)=(E,Zup,-N)

const POD={10:17.3,15:21.7,20:27.2,25:34,32:42.7,40:48.6,50:60.5,65:76.3,80:89.1,100:114.3,125:139.8,150:165.2,200:216.3,250:267.4,300:318.5};
const FL={15:{D:95,t:12,C:70},20:{D:100,t:14,C:75},25:{D:125,t:14,C:90},32:{D:135,t:16,C:100},40:{D:140,t:16,C:105},50:{D:155,t:16,C:120},65:{D:175,t:18,C:140},80:{D:185,t:18,C:150},100:{D:210,t:18,C:175},125:{D:250,t:20,C:210},150:{D:280,t:22,C:240},200:{D:330,t:22,C:290},250:{D:400,t:24,C:355},300:{D:445,t:24,C:400},350:{D:490,t:26,C:445},400:{D:560,t:28,C:510}};

const mFlange=new THREE.MeshStandardMaterial({color:0x8fa3b8,metalness:0.5,roughness:0.4});
const mWeld=new THREE.MeshStandardMaterial({color:0xd98a2b,metalness:0.3,roughness:0.6});

function cylBetween(A,B,r,mat){const d=B.clone().sub(A),L=d.length();if(L<0.1)return null;

function coneBetween(A,B,rA,rB,mat){const d=B.clone().sub(A),L=d.length();if(L<0.1)return null;

// Elbow per DHFPipeSpool MyBendVisual3D: vertex at node, tangent = R*tan(phi/2),
// center = T1 + R*n (n = in-plane normal toward bend inside). R shrinks on short legs
// so straight pipe never overshoots the tangent point (no pipe piercing the bend).
function bendGeom(Vp,d1,d2,R,tube,tIn){
 const cosd=THREE.MathUtils.clamp(d1.dot(d2),-1,1);
 const phi=Math.PI-Math.acos(cosd); // bend angle: 0=straight
 if(phi<0.05)return null;
 const t=(tIn!==undefined)?tIn:R*Math.tan(phi/2);

 const T1=Vp.clone().addScaledVector(d1,t),T2=Vp.clone().addScaledVector(d2,t);

 const x1=T1.clone().sub(C).normalize(),x2=T2.clone().sub(C).normalize();

 z.normalize();const y=new THREE.Vector3().crossVectors(z,x1).normalize();
 const tor=new THREE.Mesh(new THREE.TorusGeometry(R,tube,14,24,arc),mPipe);
 tor.applyMatrix4(new THREE.Matrix4().makeBasis(x1,y,z).setPosition(C));
 return tor;}

 const tanLen={};
 for(const id in adj){const links=adj[id];
  if(links.length===2){const cosd=THREE.MathUtils.clamp(links[0].dir.dot(links[1].dir),-1,1);
   const phi=Math.PI-Math.acos(cosd);
   if(phi>0.05){const n=nodes[id],bore=n.bore||defBore,p=V(n.p);
    const leg=Math.min(V(nodes[links[0].o].p).distanceTo(p),V(nodes[links[1].o].p).distanceTo(p));
    tanLen[id]=Math.min(1.5*bore*Math.tan(phi/2),leg*0.45);}}}
 for(const s of segs){if((s.kind||'pipe')!=='pipe')continue;const a=nodes[s.a],b=nodes[s.b];
  const A=V(a.p),B=V(b.p),dir=B.clone().sub(A).normalize(),L=A.distanceTo(B);
  const od=POD[a.bore||b.bore||defBore]||(a.bore||b.bore||defBore)*1.2;
  const ta=Math.min(tanLen[s.a]||0,L*0.45),tb=Math.min(tanLen[s.b]||0,L*0.45);
  const m=cylBetween(A.clone().addScaledVector(dir,ta),B.clone().addScaledVector(dir,-tb),od/2,mPipe);if(m)group.add(m);}
 for(const n of Object.values(nodes)){const p=V(n.p);const links=adj[n.id]||[];
  const bore=n.bore||defBore,od=POD[bore]||bore*1.2,pr=od/2;
  if(links.length===2&&tanLen[n.id]!==undefined){
   const e=bendGeom(p,links[0].dir,links[1].dir,1.5*bore,pr,tanLen[n.id]);if(e)group.add(e);
   if(n.type==='weld'){const d=links[0].dir;
    const w=cylBetween(p.clone().addScaledVector(d,-5),p.clone().addScaledVector(d,5),pr*1.08,mWeld);if(w)group.add(w);}}
  else if(n.type==='tee'&&links.length>=3){
   let bi=0,bj=1,bd=-1;for(let i=0;i<links.length;i++)for(let k=i+1;k<links.length;k++){
    const d=Math.abs(links[i].dir.dot(links[k].dir));if(d>bd){bd=d;bi=i;bj=k}}
   const others=links.map((l,i)=>i).filter(i=>i!==bi&&i!==bj);
   const a=links[bi].dir;
   const run=cylBetween(p.clone().addScaledVector(a,-od*0.8),p.clone().addScaledVector(a,od*0.8),pr*1.15,mPipe);if(run)group.add(run);
   for(const oi of others){const d=links[oi].dir;
    const br=cylBetween(p,p.clone().addScaledVector(d,od*0.9),pr*1.15,mPipe);if(br)group.add(br);}}
  else if(n.type==='flange'&&links.length>=1){const d=links[0].dir,f=FL[bore]||{D:od*2.1,t:18,C:od*1.6};
   const fb=cylBetween(p.clone().addScaledVector(d,-2),p.clone().addScaledVector(d,f.t+2),f.D/2,mFlange);if(fb)group.add(fb);
   if(n.ftype==='wn'){const hub=coneBetween(p.clone().addScaledVector(d,f.t),p.clone().addScaledVector(d,f.t+od*0.45),pr*1.18,pr,mFlange);if(hub)group.add(hub);}}
  else if(n.type==='weld'&&links.length>=1){const d=links[0].dir;
   const w=cylBetween(p.clone().addScaledVector(d,-5),p.clone().addScaledVector(d,5),pr*1.08,mWeld);if(w)group.add(w);}
  else if(n.type==='end'&&links.length===1){const cap=new THREE.Mesh(new THREE.SphereGeometry(pr*0.9,14,10),mEnd);cap.position.copy(p);group.add(cap);}
  if(n.refs&&n.refs.length){const t=document.createElement('div');t.textContent=n.refs.join(' ');t.style.cssText='color:#fff;font-size:12px;background:#0008;padding:0 4px;border-radius:3px';const o=new CSS2DObject(t);o.position.copy(p.clone().add(new THREE.Vector3(0,od*1.6,0)));group.add(o);}
 }
 // valve: joint seg between two flange nodes -> body + stem + handwheel
 for(const s of segs){if(s.kind!=='joint')continue;
  const a=nodes[s.a],b=nodes[s.b];if(!a||!b)continue;
  if(a.type!=='flange'||b.type!=='flange')continue;
  const A=V(a.p),B=V(b.p),d=B.clone().sub(A).normalize();
  const bore=a.bore||b.bore||defBore,f=FL[bore]||{D:(POD[bore]||bore*1.2)*2.1,t:18,C:0};
  const fb=cylBetween(A.clone().addScaledVector(d,f.t+2),B.clone().addScaledVector(d,-f.t-2),f.D/2*0.85,mFlange);if(fb)group.add(fb);
  const mid=A.clone().add(B).multiplyScalar(0.5);
  const up=new THREE.Vector3(0,0,1).cross(d);if(up.length()<0.1)up.set(0,1,0);up.normalize();
  const stem=cylBetween(mid.clone().addScaledVector(up,f.D*0.3),mid.clone().addScaledVector(up,f.D*0.9),(POD[bore]||bore*1.2)*0.14,mFlange);if(stem)group.add(stem);
  const hw=new THREE.Mesh(new THREE.CylinderGeometry(f.D*0.32,f.D*0.32,(POD[bore]||bore*1.2)*0.15,14),mWeld);
  hw.position.copy(mid.clone().addScaledVector(up,f.D*0.95));
  hw.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),up);group.add(hw);}
 const box=new THREE.Box3().setFromObject(group),ctr=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
 const R=Math.max(sz.x,sz.y,sz.z,500);
 fit.ctr.copy(ctr);fit.R=R;
 setView('iso');
}
